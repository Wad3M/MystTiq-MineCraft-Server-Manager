name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual run from the Actions tab: releases the version in the .csproj
  # from the selected branch and creates its vX.Y.Z tag.
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # lets SignPath fetch the unsigned build artifact

jobs:
  release:
    runs-on: windows-latest
    env:
      PROJECT: src/ASimpleMinecraftServer/ASimpleMinecraftServer.csproj
      # Code signing through SignPath Foundation runs only once the API token secret and the
      # organization id variable are set in the repository (Settings > Secrets and variables > Actions).
      SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content $env:PROJECT)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw "Tag $env:GITHUB_REF_NAME does not match project version $version." }
          $notes = "docs/releases/RELEASE_NOTES_$tag.md"
          if (-not (Test-Path $notes)) { throw "Release notes not found: $notes" }
          "TAG=$tag" | Out-File -Append $env:GITHUB_ENV
          "NOTES=$notes" | Out-File -Append $env:GITHUB_ENV

      - name: Publish Windows x64
        run: dotnet publish ${{ env.PROJECT }} -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -warnaserror -o publish

      - name: Signing status
        shell: pwsh
        run: |
          if ($env:SIGNING_ENABLED -eq 'true') { "Code signing is enabled (SignPath)." }
          else { "::notice::Code signing is not configured yet (missing SIGNPATH_API_TOKEN secret or SIGNPATH_ORGANIZATION_ID variable). This release will be unsigned." }

      - name: Upload unsigned build for signing
        id: unsigned
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: publish/ASimpleMinecraftServer.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use and verify signed build
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter ASimpleMinecraftServer.exe | Select-Object -First 1
          if (-not $signed) { throw "SignPath did not return ASimpleMinecraftServer.exe." }
          $signature = Get-AuthenticodeSignature $signed.FullName
          if ($signature.Status -ne 'Valid') { throw "Signature check failed: $($signature.Status) $($signature.StatusMessage)" }
          "Signed by: $($signature.SignerCertificate.Subject)"
          Copy-Item $signed.FullName publish/ASimpleMinecraftServer.exe -Force

      - name: Package
        shell: pwsh
        run: |
          Get-ChildItem publish | Format-Table Name, Length
          New-Item -ItemType Directory dist | Out-Null
          $exe = "MystTiq-MineCraft-Server-Manager-$env:TAG-win-x64.exe"
          Copy-Item publish/ASimpleMinecraftServer.exe "dist/$exe"
          $hash = (Get-FileHash "dist/$exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG (Get-ChildItem dist).FullName `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "MystTiq Minecraft Server Manager $env:TAG" `
            --notes-file $env:NOTES `
            --prerelease
